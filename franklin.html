  .chip i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .list { padding:6px 0; }
  .item { display:flex; gap:10px; padding:10px 16px; cursor:pointer; border-bottom:1px solid #f1f3fa; }
  .item:hover, .item.active { background:var(--tile); }
  .num { flex:none; width:24px; height:24px; border-radius:50%; color:#fff; font-size:12px; font-weight:bold;

  .item b { font-size:13px; display:block; }

  .foot { margin-top:auto; padding:12px 16px; font-size:10px; color:var(--muted); border-top:1px solid var(--line); }
  .pin { width:28px; height:28px; border-radius:50%; border:3px solid #fff; color:#fff; font:bold 12px Arial;
         display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,7,89,.35); }
  .leaflet-popup-content { font-family:Arial,Helvetica,sans-serif; color:var(--text); margin:12px 14px; min-width:190px; }
  .pop-k { font-size:10px; font-weight:bold; text-transform:uppercase; letter-spacing:.05em; }
  .pop-a { font-size:14px; font-weight:bold; margin:3px 0 1px; }
  .pop-n { font-size:11px; color:var(--muted); }

  .pop-d { font-size:12px; color:var(--muted); }
  @media (max-width:720px) {
    .main { flex-direction:column-reverse; }
    aside { width:auto; max-height:42%; border-right:0; border-top:1px solid var(--line); }

const map = L.map('map', { zoomControl:true, scrollWheelZoom:true });
L.tileLayer(D.tiles, { attribution:D.attribution, subdomains:'abcd', maxZoom:20 }).addTo(map);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ctx = L.layerGroup().addTo(map);
D.context.forEach(c => L.circleMarker([c.lat,c.lon], { radius:5, color:'#fff', weight:1.5, fillColor:D.contextColor, fillOpacity:1 })
  .bindPopup(`<div class="pop-a">${esc(c.address)}</div><div class="pop-n">${esc([c.sf,c.type].filter(Boolean).join(' · '))}</div>`)
  .addTo(ctx));

const on = { lease:true, sale:true, sold:true };
const markers = {};
D.pins.forEach(p => {
  const icon = L.divIcon({ className:'', iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-12],
    html:`<div class="pin" style="background:${D.colors[p.kind]}">${p.n}</div>` });
  const html = `<div class="pop-k" style="color:${D.colors[p.kind]}">${D.labels[p.kind]}</div>
    <div class="pop-a">${esc(p.address)}</div>
    <div class="pop-n">${esc([p.name, p.sf].filter(Boolean).join(' · '))}</div>
    <div class="pop-h">${esc(p.headline)}</div>
    <div class="pop-d">${esc(p.detail)}</div>
    ${p.broker ? `<div class="pop-d">${esc(p.broker)}</div>` : ''}`;
  markers[p.n] = L.marker([p.lat,p.lon], { icon, zIndexOffset:1000 }).bindPopup(html).addTo(map);
});

const all = D.pins.concat(D.context).map(p => [p.lat,p.lon]);
if (all.length) map.fitBounds(all, { padding:[30,30] });

function render() {
  const f = document.getElementById('filters');
  f.innerHTML = ['lease','sale','sold'].map(k => {
    const n = D.pins.filter(p => p.kind===k).length;
    return `<button class="chip" data-k="${k}" aria-pressed="${on[k]}"><i style="background:${D.colors[k]}"></i>${D.labels[k]} (${n})</button>`;
  }).join('');
  f.querySelectorAll('.chip').forEach(b => b.onclick = () => { on[b.dataset.k] = !on[b.dataset.k]; update(); });
  const l = document.getElementById('list');
  const vis = D.pins.filter(p => on[p.kind]);
  l.innerHTML = vis.length ? vis.map(p => `<div class="item" data-n="${p.n}">
      <div class="num" style="background:${D.colors[p.kind]}">${p.n}</div>
      <div><b>${esc(p.address)}</b><span>${esc(p.headline)}${p.detail ? ' · '+esc(p.detail) : ''}</span></div></div>`).join('')
    : '<div class="item"><span>No listings match these filters.</span></div>';
  l.querySelectorAll('.item[data-n]').forEach(el => el.onclick = () => {
    const m = markers[el.dataset.n]; map.setView(m.getLatLng(), Math.max(map.getZoom(), 16)); m.openPopup();
  });
}
function update() {
  D.pins.forEach(p => on[p.kind] ? markers[p.n].addTo(map) : markers[p.n].remove());
  render();
}
render();
</script></body></html>
